<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="mapa-titulo mapa-desc">
  <title id="mapa-titulo">Mapa esquemático da Vila Belmiro, em Santos</title>
  <desc id="mapa-desc">Mapa ilustrado com a Rua Dr. Carvalho de Mendonça, a Avenida Ana Costa e o estádio da Vila Belmiro. O selo da Vila dos Doces Confeitaria marca o número 452 da Rua Dr. Carvalho de Mendonça.</desc>

  <defs>
    <linearGradient id="mapa-fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4e8"/>
      <stop offset="1" stop-color="#f6ead8"/>
    </linearGradient>
    <filter id="mapa-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#23120b" flood-opacity=".18"/>
    </filter>
    <filter id="mapa-sombra-suave" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#23120b" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="28" fill="url(#mapa-fundo)"/>

  <!-- quarteirões -->
  <g fill="#fffdf8" stroke="#ead7ba" stroke-width="1.2">
    <rect x="46" y="42" width="176" height="86" rx="10"/>
    <rect x="240" y="42" width="292" height="86" rx="10"/>
    <rect x="552" y="42" width="206" height="86" rx="10"/>
    <rect x="46" y="172" width="176" height="104" rx="10"/>
    <rect x="240" y="172" width="292" height="104" rx="10"/>
    <rect x="552" y="172" width="206" height="104" rx="10"/>
    <rect x="46" y="326" width="176" height="150" rx="10"/>
    <rect x="240" y="326" width="292" height="150" rx="10"/>
    <rect x="552" y="326" width="206" height="150" rx="10"/>
  </g>

  <!-- ruas -->
  <g stroke="#ead7ba" stroke-width="34" stroke-linecap="round">
    <path d="M22 150h756"/>
    <path d="M22 304h756"/>
    <path d="M228 20v480"/>
  </g>
  <g stroke="#fffdf8" stroke-width="28" stroke-linecap="round">
    <path d="M22 150h756"/>
    <path d="M22 304h756"/>
    <path d="M228 20v480"/>
  </g>
  <!-- avenida principal, mais larga -->
  <g stroke="#ead7ba" stroke-width="42" stroke-linecap="round">
    <path d="M566 20v480"/>
  </g>
  <path d="M566 20v480" stroke="#fffdf8" stroke-width="36" stroke-linecap="round"/>

  <!-- estádio -->
  <g filter="url(#mapa-sombra-suave)">
    <ellipse cx="140" cy="402" rx="66" ry="44" fill="#e6f7fb" stroke="#12b8d8" stroke-width="2"/>
    <ellipse cx="140" cy="402" rx="42" ry="26" fill="none" stroke="#12b8d8" stroke-width="1.2" stroke-dasharray="4 5" opacity=".8"/>
    <circle cx="140" cy="402" r="3" fill="#0b7c93"/>
  </g>
  <text x="140" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b7c93">Vila Belmiro</text>
  <text x="140" y="478" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#80675c">estádio</text>

  <!-- trajeto até a loja -->
  <path d="M566 304H470" stroke="#0b7c93" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round" opacity=".95"/>

  <!-- pin da loja -->
  <g filter="url(#mapa-sombra)" transform="translate(452 304)">
    <path d="M0 0c0 0-26-25.5-26-47.5A26 26 0 0 1 26-47.5C26-25.5 0 0 0 0Z" fill="#92400e"/>
    <circle cx="0" cy="-47" r="17" fill="#fffdf8"/>
    <g transform="translate(-9 -56)">
      <path d="M2 14V8.6l4.5-4.6L11 8.6V14z" fill="#12b8d8"/>
      <rect x="5.4" y="9.4" width="2.2" height="2.6" rx=".5" fill="#fffdf8"/>
    </g>
  </g>

  <!-- rótulos das vias -->
  <g font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#80675c" letter-spacing=".06em">
    <text x="64" y="140">R. DR. CARVALHO DE MENDONÇA</text>
    <text x="64" y="294">R. DR. CARVALHO DE MENDONÇA</text>
    <text x="250" y="52" fill="#9b8478">R. TIAGO PEIXOTO</text>
    <text transform="translate(556 350) rotate(-90)" fill="#9b8478">AV. ANA COSTA</text>
    <text transform="translate(218 250) rotate(-90)" fill="#9b8478">R. GOV. PEDRO DE TOLEDO</text>
  </g>

  <!-- legenda -->
  <g transform="translate(600 424)">
    <rect x="0" y="0" width="164" height="66" rx="12" fill="#fffdf8" stroke="#ead7ba"/>
    <path d="M14 20h0" />
    <path d="M14 20c0 0-5-4.8-5-8.8a5 5 0 0 1 10 0c0 4-5 8.8-5 8.8Z" fill="#92400e"/>
    <text x="28" y="19" font-family="system-ui, sans-serif" font-size="11" fill="#23120b">Vila dos Doces — nº 452</text>
    <path d="M9 40h10" stroke="#0b7c93" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
    <text x="28" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#80675c">trajeto a pé pela Ana Costa</text>
  </g>

  <!-- rosa dos ventos -->
  <g transform="translate(730 68)" fill="#80675c" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
    <path d="M0-26 6-6 0-11-6-6Z" fill="#92400e"/>
    <text y="14">N</text>
  </g>
</svg>
